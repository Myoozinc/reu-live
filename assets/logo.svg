<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b8aff"/>
      <stop offset="35%" stop-color="#1d68f0"/>
      <stop offset="100%" stop-color="#104ecc"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="80%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a318a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a318a" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0b389e" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#082975" flood-opacity="0.3"/>
    </filter>
    <filter id="elementShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a3594" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#clayShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#glossGrad)" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shadowGrad)"/>
  <g filter="url(#elementShadow)">
    <rect x="180" y="165" width="124" height="98" rx="28" fill="#ffffff"/>
    <path d="M 302 186 C 302 183, 305 181, 308 183 L 338 200 C 342 202, 344 206, 344 210 L 344 218 C 344 222, 342 226, 338 228 L 308 245 C 305 247, 302 245, 302 242 Z" fill="#ffffff"/>
    <rect x="202" y="190" width="72" height="11" rx="5.5" fill="#1d68f0"/>
    <rect x="202" y="209" width="72" height="11" rx="5.5" fill="#1d68f0"/>
    <rect x="202" y="228" width="50" height="11" rx="5.5" fill="#1d68f0"/>
  </g>
  <g filter="url(#elementShadow)">
    <text x="256" y="342" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="62" 
          fill="#ffffff" 
          letter-spacing="-1.5">
      Reu.live
    </text>
  </g>
</svg>
